function chart(W){if(W.length<2)return '<div class="mu">Registra al menos 2 pesos para ver el gráfico.</div>';const gl=+S.p.goal||null,v=W.map(x=>x.w).concat(gl?[gl]:[]),mn=Math.min(...v)-1,mx=Math.max(...v)+1,w=300,hh=140;
 const X=i=>10+i*(w-20)/(W.length-1),Y=y=>hh-10-(y-mn)/(mx-mn)*(hh-20);
 return `<svg viewBox="0 0 ${w} ${hh}" width="100%">${gl?`<line x1="10" x2="${w-10}" y1="${Y(gl)}" y2="${Y(gl)}" stroke="#d97706" stroke-dasharray="4"/>`:''}<polyline fill="none" stroke="#16a34a" stroke-width="2.5" points="${W.map((x,i)=>X(i)+','+Y(x.w)).join(' ')}"/>${W.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="3" fill="#16a34a"/>`).join('')}</svg><div class="mu">Línea naranja: meta</div>`}

function logUi(k){const a=S.log[k]||[];const t=a.find(x=>x.d===today());const last=[...a].reverse().find(x=>x.d!==today());return `<input data-k="${k}" style="margin-top:6px" placeholder="Hoy: ej. 8 kg · 12-12-10" value="${t?t.t:''}" onchange="logEx(this.dataset.k,this.value)">${last?`<div class="mu">Última vez (${last.d}): ${last.t}</div>`:''}`}

let tI=null,tE=0;function startT(s){clearInterval(tI);tE=Date.now()+s*1000;const el=$('#timer');el.style.display='block';const f=()=>{const l=Math.ceil((tE-Date.now())/1000);if(l<=0){clearInterval(tI);el.textContent='¡Descanso terminado! Siguiente serie';try{navigator.vibrate([300,100,300])}catch(e){}setTimeout(()=>el.style.display='none',4000)}else el.textContent='Descanso: '+l+' s'};f();tI=setInterval(f,250)}
function avgIn(a,b){const now=new Date(today());const v=S.weights.filter(x=>{const d=(now-new Date(x.d))/864e5;return d>=a&&d<b}).map(x=>x.w);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
function trend(){const a=avgIn(0,7),b=avgIn(7,14);if(a==null)return adjCard();let t=`Promedio últimos 7 días: <b>${a.toFixed(1)} kg</b>.`;if(b!=null){const d=a-b;t+=` Cambio vs semana anterior: <b>${d>0?'+':''}${d.toFixed(2)} kg</b>. `;t+=d<-0.7?'Bajas muy rápido: sube 100-150 kcal para proteger el músculo.':d>-0.25?'Bajas lento: baja 100-150 kcal o suma pasos (si llevas menos de 2-3 semanas, espera).':'Ritmo ideal: mantén tus calorías.'}return `<div class="card"><h2>Tendencia semanal</h2><div class="mu">${t}</div></div>${adjCard()}`}

function delCombo(i){const c=S.combos[i];let q=0;if(c.id&&S.meals[date]){const a=S.meals[date],b=a.filter(x=>x.cid!==c.id);q=a.length-b.length;S.meals[date]=b}S.combos.splice(i,1);save();render();toast(q?`Favorita eliminada y se quitaron ${q} comidas de hoy`:'Favorita eliminada')}
function copyY(){const y=S.meals[addDays(date,-1)]||[];if(!y.length){toast('Ayer no hay comidas registradas');return}(S.meals[date]=S.meals[date]||[]).push(...JSON.parse(JSON.stringify(y)));save();render()}
async function lookup(code){code=String(code||'').trim();if(!code){toast('Escribe un código');return}toast('Buscando…');try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments');const j=await r.json();if(j.status!==1)throw 0;const n=j.product.nutriments||{};const nm=((j.product.product_name||'Producto')+(j.product.brands?' ('+j.product.brands.split(',')[0]+')':'')).slice(0,60);const it=[nm,n['energy-kcal_100g']??(n['energy_100g']||0)/4.184,n.proteins_100g||0,n.carbohydrates_100g||0,n.fat_100g||0].map((v,i)=>i?Math.round(v*10)/10:v);S.custom100=S.custom100.filter(x=>x[0]!==nm);S.custom100.unshift(it);save();render();$('#gs').value=nm;toast('Encontrado: '+nm+'. Escribe los gramos y pulsa Añadir.')}catch(e){toast('No encontré ese código o no hay conexión')}}
async function scan(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Tu navegador no escanea. Escribe el código a mano.');return}try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#bv');v.style.display='block';v.srcObject=st;await v.play();const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});const stop=()=>{st.getTracks().forEach(t=>t.stop());v.style.display='none'};const loop=async()=>{if(!v.srcObject)return;try{const r=await bd.detect(v);if(r.length){stop();lookup(r[0].rawValue);return}}catch(e){}setTimeout(loop,300)};loop();setTimeout(stop,60000)}catch(e){toast('No pude abrir la cámara. Escribe el código a mano.')}}
function pend(){if(date!==today())return '';const h=new Date().getHours(),L=[];if(!S.weights.some(x=>x.d===today())&&h>=5)L.push('⚖ Registra tu peso (en ayunas)');if(h>=11&&!(S.meals[today()]||[]).length)L.push('🍽 Aún no registras comidas');if(h>=15&&(S.water[today()]||0)<1500)L.push('💧 Llevas '+(S.water[today()]||0)+' ml de agua');const di=(new Date().getDay()+6)%7,p=PLAN[di];if(p.e.length&&di!==6&&h>=16&&!p.e.some((x,ei)=>S.done[today()+'|'+di+'|'+ei]))L.push('💪 Hoy toca: '+p.d.split(' — ')[1]+' (pestaña Entrenar)');return L.length?`<div class="card"><h2>Pendiente de hoy</h2>${L.map(x=>`<div class="it">${x}</div>`).join('')}</div>`:''}
function bars(vals,labels,target,color,unit){const w=300,hh=130,mx=Math.max(target*1.25,...vals,1),bw=(w-20)/vals.length;return `<svg viewBox="0 0 ${w} ${hh+18}" width="100%">${vals.map((v,i)=>{const bh=v/mx*hh;return `<rect x="${10+i*bw+4}" y="${hh-bh}" width="${bw-8}" height="${bh}" rx="3" fill="${color}" opacity="${v?1:.2}"/><text x="${10+i*bw+bw/2}" y="${hh+13}" font-size="10" text-anchor="middle" fill="currentColor">${labels[i]}</text>${v?`<text x="${10+i*bw+bw/2}" y="${hh-bh-3}" font-size="9" text-anchor="middle" fill="currentColor">${Math.round(v)}</text>`:''}`}).join('')}<line x1="10" x2="${w-10}" y1="${hh-target/mx*hh}" y2="${hh-target/mx*hh}" stroke="#d97706" stroke-dasharray="4"/></svg><div class="mu">Línea naranja: objetivo (${Math.round(target)} ${unit})</div>`}
function semana(){const T=targets(),days=[...Array(7)].map((_,i)=>addDays(today(),i-6)),tt=days.map(totals),DN=['D','L','M','X','J','V','S'],lb=days.map(d=>DN[new Date(d+'T12:00:00').getDay()]);const logged=tt.filter(x=>x.k>0).length,avgK=logged?tt.reduce((a,x)=>a+x.k,0)/logged:0,pOk=tt.filter(x=>x.p>=T.prot*0.9).length,kOk=tt.filter((x,i)=>x.k>0&&x.k<=targets(days[i]).kcal*1.05).length;const wk=days.filter(d=>Object.keys(S.done).some(k=>S.done[k]&&k.startsWith(d+'|'))).length;const a=avgIn(0,7),b=avgIn(7,14),wat=days.map(d=>S.water[d]||0),stp=days.map(d=>S.stepsd[d]||0).filter(x=>x>0);const m=S.meas.length>1?(S.meas.at(-1).c-S.meas[0].c).toFixed(1):null;
return `<h1>Resumen semanal</h1><div class="card"><h2>Calorías por día</h2>${bars(tt.map(x=>x.k),lb,T.base,'#16a34a','kcal')}</div><div class="card"><h2>Proteína por día</h2>${bars(tt.map(x=>x.p),lb,T.prot,'#2563eb','g')}</div>
<div class="card"><h2>Últimos 7 días</h2><div class="it"><span>Días registrados</span><b>${logged}/7</b></div><div class="it"><span>Calorías promedio</span><b>${r(avgK)} / ${T.base}</b></div><div class="it"><span>Días dentro del objetivo calórico</span><b>${kOk}</b></div><div class="it"><span>Días con proteína ≥90%</span><b>${pOk}</b></div><div class="it"><span>Días con entreno</span><b>${wk}</b></div><div class="it"><span>Agua promedio</span><b>${r(wat.reduce((x,y)=>x+y,0)/7)} ml</b></div><div class="it"><span>Pasos promedio</span><b>${stp.length?r(stp.reduce((x,y)=>x+y,0)/stp.length):'—'}</b></div><div class="it"><span>Peso promedio (vs semana anterior)</span><b>${a?a.toFixed(1)+' kg'+(b?' ('+(a-b>0?'+':'')+(a-b).toFixed(2)+')':''):'—'}</b></div>${m!==null?`<div class="it"><span>Cambio de cintura total</span><b>${m} cm</b></div>`:''}</div>${trend()}${calendar()}${progreso()}`}
let G={di:null,ei:0,set:0};

const dayTags=di=>[...new Set(PLAN[di].e.flatMap(x=>partsOf(x[0])))].map(pill).join('');
const restSec=(n,di)=>{if(/^(Plancha|Superman|Estiramientos|Dead bug|Elevaciones de piernas|Retracción|Wall angels|Gato-camello|Postura del niño|Estiramiento de)/.test(n))return 45;if(/^(Sentadilla|Peso muerto|Zancada|Subida)/.test(n))return(di===0||di===4)?120:90;if(/^(Flexiones|Press de hombros|Remo)/.test(n))return 90;return 60};

const WL=[['Marcha o trote suave en el lugar','1 min'],['Círculos de cadera','10 por lado'],['Sentadilla sin peso, lenta','10'],['Puente de glúteo','10'],['Balanceo de pierna adelante y atrás (apóyate en la pared)','10 por pierna']];

const WARM={0:{t:5,e:WL},1:{t:5,e:WU},2:{t:5,e:WP},3:{t:4,e:[['Caminata ligera','2 min'],['Gato-camello','8'],['Círculos de cadera','10 por lado'],['Rotación de tronco acostado, rodillas dobladas','8 por lado']]},4:{t:5,e:WL},5:{t:5,e:WU},6:{t:3,e:[['Respiración profunda y lenta','1 min'],['Movilidad suave de cuello y hombros','2 min']]}};
const DUR=[['30 min','40-45 min'],['23-25 min','30-35 min'],['22-25 min','30-33 min'],['25-30 min','25-30 min'],['30 min','40-45 min'],['22-25 min','30-35 min'],['8-10 min','8-10 min']];

const WHOW=[
['Marcha o trote suave','Marcha en el sitio levantando las rodillas a media altura, o trota suave con los pies cerca del suelo. Balancea los brazos y respira normal. El objetivo es subir un poco el pulso, no cansarte.'],
['Marcha en el lugar con círculos de brazos','Marcha en el sitio y a la vez dibuja círculos grandes con los brazos estirados: 30 s hacia adelante y 30 s hacia atrás. Mantén los hombros bajos y relajados.'],
['Círculos de cadera','De pie, manos en la cintura y pies al ancho de hombros. Dibuja círculos amplios con la cadera, como con un hula hula, 10 hacia un lado y 10 hacia el otro. Mueve solo la cadera, con el torso quieto.'],
['Sentadilla sin peso','Pies al ancho de hombros, puntas algo hacia afuera, brazos al frente para equilibrio. Siéntate hacia atrás y abajo en 3 s, con la espalda recta y el pecho arriba, hasta donde llegues sin dolor, y sube empujando con los talones. Las rodillas siguen la línea de los pies.'],
['Balanceo de pierna','De pie, apoya una mano en la pared. Balancea la pierna libre adelante y atrás, como un péndulo, con la rodilla casi estirada y el torso quieto. Empieza corto y sube el rango poco a poco. 10 por pierna.'],
['Rotaciones de hombro','De pie, brazos relajados. Sube los hombros hacia las orejas, llévalos hacia atrás y bájalos, dibujando un círculo lento y grande. 10 repeticiones, sin encoger el cuello.'],
['Apertura de pecho','De pie, brazos al frente a la altura del pecho. Ábrelos hacia los lados como un abrazo al revés, juntando las omóplatos al final, y vuelve. Movimiento fluido, 10 repeticiones, sin arquear la espalda baja.'],
['Flexiones en la pared','De pie frente a una pared, a un paso. Manos a la altura del pecho, algo más abiertas que los hombros. Dobla los codos acercando el pecho a la pared, con el cuerpo recto, y empuja para volver. Fácil: es solo para activar.'],
['Bisagra de cadera','De pie, pies al ancho de caderas y rodillas ligeramente flexionadas. Lleva la cadera hacia atrás como cerrando una puerta con los glúteos, inclinando el torso con la espalda recta hasta sentir los isquiotibiales. Vuelve apretando los glúteos.'],

['Respiración profunda','Sentado o de pie, inhala por la nariz 4 s llevando el aire al abdomen, y exhala por la boca 6 s. Relaja hombros y mandíbula. Repite 6-8 veces.'],

const whow=n=>{const h=WHOW.find(x=>n.startsWith(x[0]))||HOW.find(x=>n.startsWith(x[0]));return h?h[1]:''};
const warmUi=(di,open)=>{const w=WARM[di];return `<div class="card"><details ${open?'open':''}><summary>🔥 Calentamiento (~${w.t} min)</summary>${w.e.map(x=>{const t=whow(x[0]);return `<div class="it" style="display:block"><div class="row sp" style="flex-wrap:nowrap"><span>${x[0]}</span><b style="white-space:nowrap">${x[1]}</b></div>${t?`<details><summary class="mu" style="font-weight:400">Cómo hacerlo</summary><div class="mu">${t}</div></details>`:''}</div>`}).join('')}<div class="mu" style="margin-top:6px">Hazlo suave y sin pausas largas: el objetivo es subir la temperatura y mover las articulaciones antes de empezar.</div></details></div>`};
function guia(){if(G.di===null)G.di=(new Date().getDay()+6)%7;const p=PLAN[G.di],sets=weekNo()<=2?2:3;const sel=`<select onchange="G.di=+this.value;G.ei=0;G.set=0;render()" style="width:100%">${PLAN.map((x,i)=>`<option value="${i}" ${G.di===i?'selected':''}>${x.d}</option>`).join('')}</select>`;
let h=`<h1>Entrenar</h1><div class="card">${sel}<div class="mu" style="margin-top:6px">Semana ${weekNo()}: ${sets} series por ejercicio</div><div class="mu">⏱ Duración estimada: <b>${durTxt(G.di)}</b> (incluye calentamiento)</div></div>${warmUi(G.di,G.ei===0&&G.set===0)}`;
if(!p.e.length)return h+`<div class="card">${p.n}</div>`;
if(G.ei>=p.e.length)return h+`<div class="card"><div class="big">¡Sesión completa! 🎉</div><p>Buen trabajo. Come tu proteína, hidrátate y duerme bien: así crece el músculo.</p><button onclick="G.ei=0;G.set=0;render()">Repetir</button></div>`;
const ex=p.e[G.ei],hw=HOW.find(x=>ex[0].startsWith(x[0]));
return h+`<div class="card"><div class="mu">Ejercicio ${G.ei+1} de ${p.e.length}</div><h2 style="font-size:19px">${ex[0]}</h2><div><b>${ex[1]}</b></div><div style="margin:4px 0">${bodyTags(ex[0])}</div><div class="mu">⏱ Descanso entre series: <b>${restSec(ex[0],G.di)} s</b> (el temporizador arranca solo al pulsar “Serie hecha”)</div><div class="big" style="margin:8px 0">Serie ${G.set+1} de ${sets}</div><div class="bar"><i style="width:${(G.ei*sets+G.set)/(p.e.length*sets)*100}%"></i></div>${hw?`<div class="mu" style="margin-bottom:8px">${hw[1]}</div>`:''}${vidUi(ex[0])}${logUi(G.di+'-'+G.ei)}<div class="row" style="margin-top:10px"><button class="p" style="flex:1" onclick="doneSet()">✓ Serie hecha</button></div><div class="row" style="margin-top:8px"><button onclick="gPrev()">← Anterior</button><button onclick="gSkip()">Saltar →</button></div></div>`}
function doneSet(){const p=PLAN[G.di],sets=weekNo()<=2?2:3;const rest=restSec(p.e[G.ei][0],G.di);G.set++;if(G.set>=sets){S.done[today()+'|'+G.di+'|'+G.ei]=true;G.ei++;G.set=0;if(G.ei<p.e.length)startT(Math.max(90,rest));else{try{navigator.vibrate([200,100,200])}catch(e){}}}else startT(rest);save();render()}

function adjCard(){const a=avgIn(0,7),b=avgIn(7,14),c=avgIn(14,21);if(a==null||b==null||c==null)return `<div class="card"><h2>Ajuste automático</h2><div class="mu">Necesito pesos de 3 semanas seguidas para sugerirte un ajuste de calorías.${S.kcalAdj?` Ajuste actual: ${S.kcalAdj>0?'+':''}${S.kcalAdj} kcal. <button onclick="applyAdj(-S.kcalAdj)">Quitar ajuste</button>`:''}</div></div>`;const r1=a-b,r2=b-c,T=targets();let msg,d=0;if(S.adjDate&&(new Date(today())-new Date(S.adjDate))/864e5<14)msg='Ajustaste hace menos de 14 días: espera para ver el efecto.';else if(r1<-0.7&&r2<-0.7){d=150;msg=`Bajas muy rápido dos semanas seguidas (${r1.toFixed(2)} y ${r2.toFixed(2)} kg/sem). Te sugiero subir 150 kcal para proteger el músculo.`}else if(r1>-0.2&&r2>-0.2){if(T.base-150>=T.bmr*1.2){d=-150;msg=`Bajas muy lento dos semanas seguidas (${r1.toFixed(2)} y ${r2.toFixed(2)} kg/sem). Te sugiero bajar 150 kcal.`}else msg='Bajas lento, pero ya estás cerca de un mínimo seguro. Mejor suma pasos o revisa tus porciones.'}else msg=`Ritmo bien (${r1.toFixed(2)} y ${r2.toFixed(2)} kg/sem): mantén tus calorías.`;return `<div class="card"><h2>Ajuste automático</h2><div class="mu">${msg}</div>${d?`<button class="p" style="margin-top:8px" onclick="applyAdj(${d})">Aplicar ${d>0?'+':''}${d} kcal</button>`:''}${S.kcalAdj?`<div class="mu" style="margin-top:6px">Ajuste actual: ${S.kcalAdj>0?'+':''}${S.kcalAdj} kcal <button onclick="applyAdj(-S.kcalAdj)">Quitar</button></div>`:''}</div>`}
function applyAdj(d){S.kcalAdj=(S.kcalAdj||0)+d;S.adjDate=today();save();render();toast('Objetivo actualizado: '+targets().base+' kcal')}

const MENUS=[{n:'Menú A',m:{desayuno:[['Huevo entero',150],['Avena en hojuelas (cruda)',60],['Banano (plátano)',100],['Leche descremada',200]],almuerzo:[['Pechuga de pollo cocida',180],['Arroz blanco cocido',200],['Frijoles cocidos',100],['Tomate',100],['Lechuga',60],['Aceite de oliva',10]],snack:[['Yogur griego natural sin grasa',200],['Almendras',25],['Manzana',150]],cena:[['Pescado blanco (tilapia) cocido',180],['Papa cocida',250],['Brócoli',150],['Aceite de oliva',8]]}},
{n:'Menú B',m:{desayuno:[['Pan integral',80],['Huevo entero',100],['Aguacate',50],['Naranja',150]],almuerzo:[['Carne de res magra cocida',160],['Pasta cocida',220],['Tomate',100],['Zanahoria',80],['Aceite de oliva',10]],snack:[['Requesón (cottage)',150],['Banano (plátano)',120],['Nueces',20]],cena:[['Atún en agua',150],['Arroz integral cocido',180],['Espinaca',100],['Aguacate',50]]}},
{n:'Menú C',m:{desayuno:[['Yogur griego natural sin grasa',250],['Avena en hojuelas (cruda)',50],['Fresa',150],['Miel',10]],almuerzo:[['Muslo de pollo sin piel cocido',200],['Camote (batata) cocido',250],['Brócoli',150],['Aceite de oliva',8]],snack:[['Huevo entero',100],['Pan integral',50],['Jamón de pavo',40]],cena:[['Salmón cocido',150],['Arroz blanco cocido',150],['Calabacín',150],['Lechuga',60]]}}];
const dbi=n=>DB100.find(x=>x[0]===n);
function menuCalc(i){const m=MENUS[i].m,raw=Object.values(m).flat().reduce((a,[n,g])=>a+dbi(n)[1]*g/100,0),f=targets().base/raw;const out=[];let t={k:0,p:0,c:0,f:0};MOMS.forEach(([mk,lb])=>{(m[mk]||[]).forEach(([n,g])=>{const gg=Math.max(5,Math.round(g*f/5)*5),d=dbi(n),q=gg/100;const it={m:mk,lb,n,g:gg,k:d[1]*q,p:d[2]*q,c:d[3]*q,f:d[4]*q};out.push(it);t.k+=it.k;t.p+=it.p;t.c+=it.c;t.f+=it.f})});return{items:out,t}}
function menus(){const c=menuCalc(MENU);const T=targets();return `<h1>Plan</h1>${ptTog()}${macroPie()}${foodExplorer()}<div class="card"><div class="row">${MENUS.map((m,i)=>`<button onclick="MENU=${i};render()" style="${MENU===i?'background:var(--ac);color:#fff;border:0':''}">${m.n}</button>`).join('')}</div><div class="mu" style="margin-top:8px">Porciones ajustadas a tu objetivo de ${T.base} kcal. Total del menú: <b>${r(c.t.k)} kcal</b> · P ${r(c.t.p)} g · C ${r(c.t.c)} g · G ${r(c.t.f)} g (tu proteína objetivo: ${T.prot} g).</div></div>${MOMS.map(([mk,lb])=>{const L=c.items.filter(x=>x.m===mk);return L.length?`<div class="card"><h2>${lb}</h2>${L.map(x=>`<div class="it"><span>${x.n}<div style="margin:3px 0">${tagsOf(x.p,x.c,x.f)}</div></span><span class="mu">${x.g} g · ${r(x.k)} kcal · P${r(x.p)}</span></div>`).join('')}</div>`:''}).join('')}<div class="card"><button class="p" onclick="addMenu()">➕ Agregar este menú a ${date===today()?'hoy':date}</button><div class="mu" style="margin-top:6px">Puedes cambiar alimentos por equivalentes y editar cada comida después.</div></div><div class="card"><h2>Lista de compras (7 días)</h2><div class="mu">Rotando A, B, C, A, B, C, A. Los pesos son de alimento ya cocido, como en la tabla.</div>${shopList().map(([n,g])=>`<div class="it"><span>${n}</span><b>${g>=1000?(g/1000).toFixed(1)+' kg':g+' g'}</b></div>`).join('')}<button style="margin-top:8px" onclick="copyShop()">Copiar lista</button></div>`}


const TAGS={p:['Proteína','#2563eb'],c:['Carbohidratos','#16a34a'],f:['Grasa','#d97706']};
function tagKeys(p,c,f){const v={p:p*4,c:c*4,f:f*9},t=v.p+v.c+v.f;if(!(t>0))return [];const k=Object.keys(v).filter(x=>v[x]/t>=0.25);return k.length?k:[Object.keys(v).sort((a,b)=>v[b]-v[a])[0]]}
const tagsOf=(p,c,f)=>tagKeys(p,c,f).map(k=>`<span style="display:inline-block;background:${TAGS[k][1]};color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;margin-right:4px">${TAGS[k][0]}</span>`).join('');
const tagLabel=(p,c,f)=>tagKeys(p,c,f).map(k=>TAGS[k][0]).join(' + ');
let FT='todos';
function foodExplorer(){const L=allDB().filter(x=>FT==='todos'||tagKeys(x[2],x[3],x[4]).includes(FT)).sort((a,b)=>a[0].localeCompare(b[0]));return `<div class="card"><h2>Alimentos por tipo</h2><div class="mu" style="margin-bottom:8px">Cada alimento lleva la etiqueta de los macros que más aportan (≥25% de sus calorías). Valores por 100 g.</div><div class="chips row">${[['todos','Todos','#6b7480'],['p','Proteína','#2563eb'],['c','Carbohidratos','#16a34a'],['f','Grasa','#d97706']].map(([k,n,col])=>`<button onclick="FT='${k}';render()" style="${FT===k?`background:${col};color:#fff;border:0`:''}">${n}</button>`).join('')}</div>${L.map(x=>`<div class="it"><div>${x[0]}<div style="margin:3px 0">${tagsOf(x[2],x[3],x[4])}</div><div class="mu">${r(x[1])} kcal · P${x[2]} C${x[3]} G${x[4]}</div></div><button class="x" onclick="addFrom('${x[0].replace(/'/g,"\\'")}')">➕</button></div>`).join('')||'<div class="mu">—</div>'}</div>`}
function addFrom(n){tab='hoy';render();scrollTo(0,0);const e=$('#gs');if(e){e.value=n;const g=$('#gg');if(g)g.focus()}toast('Escribe los gramos de '+n+' y pulsa Añadir por gramos')}
function macroPie(){const T=targets(),p=T.prot,f=T.fat,k=T.base,c=Math.max(0,Math.round((k-p*4-f*9)/4)),kp=p*4,kc=c*4,kf=f*9,tot=kp+kc+kf||1,parts=[['Proteína',p,kp,'#2563eb'],['Carbohidratos',c,kc,'#16a34a'],['Grasa',f,kf,'#d97706']];let a=-Math.PI/2;const R=70,cx=90,cy=90;const paths=parts.map(([n,g,kk,col])=>{const ang=kk/tot*2*Math.PI,a1=a+ang,x0=cx+R*Math.cos(a),y0=cy+R*Math.sin(a),x1=cx+R*Math.cos(a1-0.0001),y1=cy+R*Math.sin(a1-0.0001),big=ang>Math.PI?1:0,d=`M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;a=a1;return `<path d="${d}" fill="${col}" stroke="var(--card)" stroke-width="2"/>`}).join('');return `<div class="card"><h2>Proporción de macros de tu objetivo</h2><div class="row" style="flex-wrap:nowrap"><svg viewBox="0 0 180 180" width="150" height="150" style="flex:none">${paths}<circle cx="${cx}" cy="${cy}" r="34" fill="var(--card)"/><text x="${cx}" y="${cy-2}" font-size="15" font-weight="700" text-anchor="middle" fill="currentColor">${k}</text><text x="${cx}" y="${cy+13}" font-size="10" text-anchor="middle" fill="currentColor">kcal/día</text></svg><div style="flex:1">${parts.map(([n,g,kk,col])=>`<div class="it" style="border:0;padding:4px 0"><span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${col};margin-right:6px"></span>${n}</span><span><b>${Math.round(kk/tot*100)}%</b> <span class="mu">${g} g</span></span></div>`).join('')}</div></div><div class="mu" style="margin-top:6px">Calculado así: proteína ${S.p.prot} g/kg × ${T.w} kg, grasa 0,8 g/kg y el resto en carbohidratos, sobre tu objetivo de ${k} kcal (déficit del ${S.p.def}%). Proteína y carbohidratos aportan 4 kcal por gramo y la grasa 9.</div></div>`}
function addMenu(){const c=menuCalc(MENU);const L=(S.meals[date]=S.meals[date]||[]);c.items.forEach(x=>L.push({n:`${x.n} ${x.g} g`,k:x.k,p:x.p,c:x.c,f:x.f,m:x.m}));save();tab='hoy';render();toast('Menú agregado a tu registro')}
function shopList(){const tot={};[0,1,2,0,1,2,0].forEach(i=>menuCalc(i).items.forEach(x=>{tot[x.n]=(tot[x.n]||0)+x.g}));return Object.entries(tot).sort((a,b)=>a[0].localeCompare(b[0]))}
function copyShop(){const t=shopList().map(([n,g])=>`- ${n}: ${g} g`).join('\n');try{navigator.clipboard.writeText(t).then(()=>toast('Lista copiada')).catch(()=>toast('No pude copiar'))}catch(e){toast('No pude copiar')}}
function calendar(){const base=new Date(today().slice(0,7)+'-01T12:00:00');base.setMonth(base.getMonth()+CM);const y=base.getFullYear(),mo=base.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];let cells=['L','M','X','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);let streak=0;for(let d=1;d<=dim;d++){const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,f=(S.meals[ds]||[]).length>0,w=Object.keys(S.done).some(k=>S.done[k]&&k.startsWith(ds+'|')),bg=f&&w?'#16a34a':f?'#86efac':w?'#93c5fd':'';cells+=`<button onclick="date='${ds}';tab='hoy';render()" style="${bg?`background:${bg};color:#111;border:0`:''};${ds===today()?'outline:2px solid var(--ac2)':''}">${d}</button>`}let st=0;for(let k=0;k<400;k++){const ds=addDays(today(),-k);if((S.meals[ds]||[]).length)st++;else if(k>0)break}return `<div class="card"><div class="row sp"><button onclick="CM--;render()">←</button><h2 style="margin:0">${names[mo]} ${y}</h2><button onclick="CM++;render()">→</button></div><div class="cal" style="margin-top:8px">${cells}</div><div class="mu" style="margin-top:8px">🟩 comida y entreno · 🟢 solo comida · 🔵 solo entreno · racha actual de registro: <b>${st} días</b></div></div>`}
function parseLog(t){const kg=t.match(/(\d+(?:[.,]\d+)?)\s*kg/i),rest=t.replace(/(\d+(?:[.,]\d+)?)\s*kg/i,''),mx=rest.match(/(\d+)\s*[x×]\s*(\d+)/);let reps=0;if(mx)reps=+mx[1]*+mx[2];else reps=(rest.match(/\d+/g)||[]).map(Number).reduce((a,b)=>a+b,0);if(!reps)return null;const w=kg?parseFloat(kg[1].replace(',','.')):0;return{w,reps,v:w?w*reps:reps}}
function spark(v){const w=280,h=60,mn=Math.min(...v),mx=Math.max(...v),X=i=>8+i*(w-16)/(v.length-1),Y=y=>h-8-(mx===mn?.5:(y-mn)/(mx-mn))*(h-16);return `<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="${v.map((y,i)=>X(i)+','+Y(y)).join(' ')}"/>${v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="3" fill="#2563eb"/>`).join('')}</svg>`}
function progreso(){const rows=Object.keys(S.log).map(k=>{const [di,ei]=k.split('-').map(Number),ex=PLAN[di]&&PLAN[di].e[ei];if(!ex)return '';const p=S.log[k].map(x=>({d:x.d,...parseLog(x.t)||{}})).filter(x=>x.v);if(p.length<2)return '';const f=p[0],l=p.at(-1),ch=((l.v-f.v)/f.v*100);return `<div style="margin-top:10px"><b>${ex[0].split(/[(,]/)[0]}</b>${spark(p.map(x=>x.v))}<div class="mu">${f.d}: ${f.w?f.w+' kg × ':''}${f.reps} reps → ${l.d}: ${l.w?l.w+' kg × ':''}${l.reps} reps (${ch>=0?'+':''}${r(ch)}% volumen)</div></div>`}).join('');return `<div class="card"><h2>Progreso en ejercicios</h2>${rows||'<div class="mu">Anota tu peso y repeticiones (ej. "8 kg · 12-12-10") en al menos 2 sesiones de un ejercicio para ver su gráfico.</div>'}</div>`}
function applyUi(){const u=S.ui||{theme:'auto',font:100};try{if(u.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',u.theme);document.body.style.zoom=(u.font||100)/100}catch(e){}}
function autoSnap(){try{const t=today();if(!S.bkAuto||(new Date(t)-new Date(S.bkAuto))/864e5>=7){S.bkAuto=t;localStorage.setItem('dc_snap',JSON.stringify(S));save()}if(!S.bkLast||(new Date(t)-new Date(S.bkLast))/864e5>=7)setTimeout(()=>toast('Hace más de 7 días sin copia tuya: Perfil → Copia de seguridad'),1500)}catch(e){}}
function restoreSnap(){try{const x=JSON.parse(localStorage.getItem('dc_snap'));if(!x)throw 0;S={...S,...x};save();applyUi();render();toast('Copia interna restaurada')}catch(e){toast('No hay copia interna disponible')}}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='deficit-calorico.json';a.click()}
function render(){$('#app').innerHTML=view();$('#nav').innerHTML=[['hoy','🍽 Hoy'],['peso','⚖ Peso'],['guia','▶ Entrenar'],['plan','💪 Plan'],['sem','📊 Semana'],['perfil','👤 Perfil']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)">${t[1]}</button>`).join('')}
applyUi();phaseCheck();render();autoSnap();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
